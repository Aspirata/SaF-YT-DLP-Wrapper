# QUALITY prefers ready AV1 over VP9 at the same resolution/FPS and can convert VP9 to AV1 as a fallback.
# MODERN outputs editing-friendly MP4: at equal resolution/FPS prefers H.265, then H.264, AV1, and VP9.
# UNIVERSAL prefers native H.264 at the best resolution/FPS and converts other video to H.264.
PROFILE=MODERN

# 0 means no resolution limit. Otherwise use a height such as 720, 1080, or 1440.
MAX_HEIGHT=1080

# video, audio, or thumbnail
DEFAULT_MODE=video

# YES converts VP9 to AV1 in QUALITY. MODERN converts VP9 to H.265; UNIVERSAL converts it to H.264.
TRANSCODE_VP9_TO_AV1=YES

# YES prefers NVIDIA, Intel, or AMD GPU encoding and falls back to the CPU on failure.
ALLOW_HARDWARE_TRANSCODING=YES

# YES stores QUALITY audio-only Opus in an MP4 container for better compatibility.
STORE_OPUS_IN_MP4=YES

# YES downloads one best audio stream per available language and stores them as separate tracks in one file.
DOWNLOAD_ALL_AUDIO_TRACKS=YES

# Filled automatically with the last browser whose cookies worked.
COOKIE_BROWSER=zen
